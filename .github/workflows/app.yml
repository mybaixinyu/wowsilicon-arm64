name: app

# Builds WoWSilicon.app from WoWSilicon/WoWSilicon with patches/app on top,
# through its own Makefile, around the Wine bundle build.yml made: after it
# in the same run, or alone from an earlier run's artifact.
on:
  workflow_call:
    inputs:
      app_ref:
        type: string
        default: 5276d92627f26334f6580270eabadf22361d3717
  workflow_dispatch:
    inputs:
      wine_run_id:
        description: build.yml run whose Wine bundle goes into the app
        required: true
        type: string
      app_ref:
        description: WoWSilicon/WoWSilicon full commit SHA (or tag) to build
        default: 5276d92627f26334f6580270eabadf22361d3717
        type: string

permissions:
  contents: read
  actions: read

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci
      - uses: actions/checkout@v7
        with:
          repository: WoWSilicon/WoWSilicon
          ref: ${{ inputs.app_ref }}
          path: app
      - name: Apply patches
        run: for p in "$GITHUB_WORKSPACE"/ci/patches/app/*.patch; do git -C app apply --verbose "$p"; done
      # WoWSilicon 3.3.0 ships only as a build, without its source. Its
      # libSiliconPatch for 3.3.5a and its libDllLdr, which also patches
      # DivxDecoder.dll and keeps the entry point inside .text, replace 3.2.2's,
      # and its DXVK 3.1.1 replaces 3.2.2's v3.0.2-74-g0dc6a2d. Its KosmicKrisp goes into the
      # Wine bundle further down.
      - name: Take libSiliconPatch, libDllLdr, DXVK and KosmicKrisp from WoWSilicon Preview3.3.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo preview.zip https://github.com/WoWSilicon/WoWSilicon/releases/download/Preview3.3.0/WoWSilicon_3.3.0_Preview.zip
          echo "b9d7c9606c526903da017066dc643b656517fef368a3d14f39c1d7a417392e8a  preview.zip" | shasum -a 256 -c
          from=WoWSilicon_3.3.0_Preview.app/Contents/Resources/WoWSilicon-swift_WoWSiliconSwift.bundle/Contents/Resources/Patching
          kk=WoWSilicon_3.3.0_Preview.app/Contents/Resources/Wine/lib/external/libvulkan_kosmickrisp.dylib
          unzip -q preview.zip "$from/libSiliconPatch/wotlk/libSiliconPatch.dll" "$from/DllLoader/libDllLdr.dll" \
            "$from/dxvk-kosmickrisp/d3d9.dll" "$from/dxvk-kosmickrisp/LICENSE" "$kk" -d preview
          echo "52d7b68364e19d744882533d663d69b898bfd294f4248b3313785ad801e23e58  preview/$kk" | shasum -a 256 -c
          to="$GITHUB_WORKSPACE/app/Sources/WoWSiliconSwift/Resources/Patching"
          cp "preview/$from/libSiliconPatch/wotlk/libSiliconPatch.dll" "$to/libSiliconPatch/wotlk/libSiliconPatch.dll"
          cp "preview/$from/DllLoader/libDllLdr.dll" "$to/winerosetta/libDllLdr.dll"
          cp "preview/$from/dxvk-kosmickrisp/d3d9.dll" "preview/$from/dxvk-kosmickrisp/LICENSE" "$to/dxvk-kosmickrisp/"
          shasum -a 256 -c <<EOF
          76bcddae2fe04c407f197910c323731fa623763289254b319e03c0e3fb079565  $to/libSiliconPatch/wotlk/libSiliconPatch.dll
          f7ac6193767e092bd6c972cd6203a08bd969275a5c19df3e243b76a7c6007acd  $to/winerosetta/libDllLdr.dll
          2a8f5f76a0332665623c96bef0669f5a8ca2de55297f76cf0fcb00951f1ddfab  $to/dxvk-kosmickrisp/d3d9.dll
          a5cb1a6ded7d2d7e92d550ba28edd21be2d1d4044662b399887351023e30ce64  $to/dxvk-kosmickrisp/LICENSE
          EOF
          # The replacement for the lowpass DSP's coefficient update (0x8F2C70)
          # is hooked without the ECX-saving thunk the other replacements
          # have, and its caller reads ECX after it: route it through one,
          # written into the padding after a function, like theirs.
          python3 -I - "$to/libSiliconPatch/wotlk/libSiliconPatch.dll" <<'EOF'
          import struct, sys
          path = sys.argv[1]
          b = bytearray(open(path, 'rb').read())
          entry, cave = 0xB1020, 0x12310
          assert struct.unpack_from('<II', b, entry) == (0x8F2C70, 0x62388D10)
          assert b[cave - 2:cave + 20] == b'\x90' * 22
          thunk_va = 0x62352F10
          thunk = b'\x51\xff\x74\x24\x0c\xff\x74\x24\x0c\xe8' + struct.pack('<i', 0x62388D10 - (thunk_va + 14)) + b'\x59\xc2\x08\x00'
          b[cave:cave + len(thunk)] = thunk
          struct.pack_into('<I', b, entry + 4, thunk_va)
          open(path, 'wb').write(b)
          EOF
          echo "b112d83db4dda8c334b85bf7f4adfdddc5a58e478b15734a012f616dc78307c0  $to/libSiliconPatch/wotlk/libSiliconPatch.dll" | shasum -a 256 -c
      - name: Wine bundle from this run
        if: inputs.wine_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: wowsilicon-arm64-*
          path: ${{ runner.temp }}/wine
          merge-multiple: true
      - name: Wine bundle from run ${{ inputs.wine_run_id }}
        if: inputs.wine_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: wowsilicon-arm64-*
          path: ${{ runner.temp }}/wine
          merge-multiple: true
          run-id: ${{ inputs.wine_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the Wine bundle
        run: |
          cd "$RUNNER_TEMP/wine"
          ls
          shasum -a 256 -c ./*.tar.xz.sha256
          tar -xJf ./*.tar.xz
          # build.yml now writes BUILD-INFO.txt and package.sh's notes.md
          # beside the tarball; bundles of earlier runs carry it inside.
          [ -f BUILD-INFO.txt ] || cp wine/BUILD-INFO.txt BUILD-INFO.txt
          cat BUILD-INFO.txt
          [ ! -f notes.md ] || cat notes.md
      # The patcher copies lib/mtld3d.conf into the game. WoWSilicon's own
      # runtime takes it from the mtld3d release beside the DLLs; bundle-wine.sh
      # installs only the DLLs, so the file comes from the release the
      # bundle's mach9 pins, checked against the mtld3d.so installed
      # (the PE files are stripped).
      - name: Add mtld3d.conf from the bundle's mtld3d release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          ref=$(sed -nE 's,^(wine-build|mach9): athei/(wine-build|mach9)@([0-9a-f]{40}) .*,\3,p' wine/BUILD-INFO.txt)
          [ -n "$ref" ]
          gh api "repos/athei/mach9/contents/pins/redist.env?ref=$ref" -H 'Accept: application/vnd.github.raw' > redist.env
          . ./redist.env
          curl -fsSLo mtld3d.tar.xz "$MTLD3D_URL"
          echo "$MTLD3D_SHA256  mtld3d.tar.xz" | shasum -a 256 -c
          mkdir mtld3d
          tar -xJf mtld3d.tar.xz -C mtld3d
          cmp mtld3d/wine/aarch64-unix/mtld3d.so wine/wine/lib/wine/d3d9/mtld3d/aarch64-unix/mtld3d.so
          cp mtld3d/mtld3d.conf wine/wine/lib/mtld3d.conf
      # The DXVK backend runs on the Vulkan driver the app finds as
      # lib/vulkan/icd.d/KosmicKrisp_icd.json. Preview3.3.0's driver (signed by
      # LunarG) goes beside it, not over the KosmicKrisp the bundle has in
      # lib/external, which the rest of Wine's Vulkan keeps using. Like
      # Preview3.3.0, no MoltenVK: in 3.2.2 it ran only the old D9VK 1.10.3.
      - name: Add Preview3.3.0's KosmicKrisp for the DXVK backend
        run: |
          w="$RUNNER_TEMP/wine/wine/lib/vulkan"
          mkdir -p "$w/icd.d"
          cp "$RUNNER_TEMP/preview/WoWSilicon_3.3.0_Preview.app/Contents/Resources/Wine/lib/external/libvulkan_kosmickrisp.dylib" "$w/"
          codesign --verify --strict --verbose "$w/libvulkan_kosmickrisp.dylib"
          printf '%s\n' \
            '{' \
            '  "file_format_version": "1.0.1",' \
            '  "ICD": {' \
            '    "api_version": "1.4.0",' \
            '    "library_path": "../libvulkan_kosmickrisp.dylib"' \
            '  }' \
            '}' > "$w/icd.d/KosmicKrisp_icd.json"
      # The app carries what runs games; headers, import and static libraries,
      # the SDK tools, man pages and Wine's graphics tests stay in the bundle
      # artifact.
      - name: Drop what only building against Wine or testing it needs
        run: |
          w="$RUNNER_TEMP/wine/wine"
          du -sh "$w"
          rm -rf "$w/include" "$w/lib/wine/tests" "$w/share/man"
          find "$w/lib" -name '*.a' -type f -delete
          for tool in function_grep.pl widl winebuild winecpp winedump wineg++ winegcc winemaker wmc wrc; do
            rm "$w/bin/$tool"
          done
          du -sh "$w"
      # The Makefile's audio helper compiler.
      - name: Toolchain
        run: |
          brew install mingw-w64
          swift --version
      - name: Test
        working-directory: app
        run: swift test
      - name: Bundle
        working-directory: app
        run: |
          make bundle \
            WINE_RUNTIME_DIR="$RUNNER_TEMP/wine/wine" \
            ICON_SRC="$GITHUB_WORKSPACE/ci/app/icon.png"
      - name: Check the bundle
        working-directory: app
        run: |
          app=.build/WoWSilicon.app
          codesign --verify --strict --verbose "$app"
          codesign --verify --strict --verbose "$app/Contents/Resources/Wine/lib/wine/aarch64-unix/wine.app"
          ! /usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/Wine/lib/mtld3d.conf"
          cmp "$RUNNER_TEMP/preview/WoWSilicon_3.3.0_Preview.app/Contents/Resources/WoWSilicon-swift_WoWSiliconSwift.bundle/Contents/Resources/Patching/DllLoader/libDllLdr.dll" \
            "$app/Contents/Resources/WoWSilicon-swift_WoWSiliconSwift.bundle/Patching/winerosetta/libDllLdr.dll"
          echo "b112d83db4dda8c334b85bf7f4adfdddc5a58e478b15734a012f616dc78307c0  $app/Contents/Resources/WoWSilicon-swift_WoWSiliconSwift.bundle/Patching/libSiliconPatch/wotlk/libSiliconPatch.dll" | shasum -a 256 -c
          echo "2a8f5f76a0332665623c96bef0669f5a8ca2de55297f76cf0fcb00951f1ddfab  $app/Contents/Resources/WoWSilicon-swift_WoWSiliconSwift.bundle/Patching/dxvk-kosmickrisp/d3d9.dll" | shasum -a 256 -c
          vk="$app/Contents/Resources/Wine/lib/vulkan"
          codesign --verify --strict --verbose "$vk/libvulkan_kosmickrisp.dylib"
          test -f "$vk/icd.d/$(plutil -extract ICD.library_path raw -o - "$vk/icd.d/KosmicKrisp_icd.json")"
          tools/wine-runtime/validate.sh --runtime "$app/Contents/Resources/Wine"
      - name: Package
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/.build/WoWSilicon.app/Contents/Info.plist)
          name="app-wowsilicon-arm64-$version-$(git -C ci rev-parse --short HEAD)"
          {
            echo "app: WoWSilicon/WoWSilicon@$(git -C app rev-parse HEAD) + $(ls ci/patches/app | tr '\n' ' ')"
            echo "repo: $GITHUB_REPOSITORY@$GITHUB_SHA"
            sed 's/^/wine bundle: /' "$RUNNER_TEMP/wine/BUILD-INFO.txt"
          } | tee app/.build/BUILD-INFO.txt
          tar -C app/.build -cJf "$name.tar.xz" WoWSilicon.app BUILD-INFO.txt
          shasum -a 256 "$name.tar.xz" | tee "$name.tar.xz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz
            ${{ env.NAME }}.tar.xz.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
