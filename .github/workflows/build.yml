name: build

# Builds the whole arm64 Wine bundle of athei/wine-build (Wine, FEX, DXMT,
# Mesa's KosmicKrisp and the Vulkan loader, with mtld3d from its release)
# through its own build-wine.sh and bundle-wine.sh, with patches/wine on top
# of athei/wine. The one part this repository cannot make is the signed
# loader app: its entitlement needs a certificate of the provisioning
# profile's team, so wine.app comes from a wine-build release, and
# bundle-wine.sh refuses it unless the loader this build makes is the same
# code (patches/wine-build). Manual only.
on:
  workflow_dispatch:
    inputs:
      wine_ref:
        description: athei/wine full commit SHA (or branch) to build
        default: e2e42653b41e48fc7a6ed00569d3aaea9719ed5b
        type: string
      wine_build_ref:
        description: athei/wine-build full commit SHA (or branch) whose scripts build it
        default: c0e75582530cf7008dd998a54960748a036281c6
        type: string
      fex_ref:
        description: athei/FEX full commit SHA, written to pins/fex-src.ref
        default: 977affeb7ddbd853e7e8290ed3fbb5be0eb48deb
        type: string
      mesa_ref:
        description: athei/mesa full commit SHA, written to pins/mesa-src.ref
        default: 46416db6940bf647d22be69c18fc0ae05393495b
        type: string
      loader_release:
        description: athei/wine-build release whose signed wine.app is bundled
        default: arm64-11.19-1
        type: string

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW: llvm-mingw-20261006-ucrt-macos-universal
  LLVM_MINGW_SHA256: a7a19b11048e89372637d26279cdb7c430ed3cf8c1e224310421312bf986ebf6
  # DEPS_FORMULAE of bin/lib/profile.sh, the formulae build-mesa.sh's tools
  # link, and the build tools the scripts check for.
  FORMULAE: >-
    freetype gnutls sdl2-compat sdl3 bison pkgconf
    llvm spirv-llvm-translator spirv-tools
    meson ninja cmake

jobs:
  build:
    # macOS 27 with its SDK, which the arm64-11.19-1 bundle was built with.
    runs-on: xcode-27
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci
      - uses: actions/checkout@v5
        with:
          repository: athei/wine-build
          ref: ${{ inputs.wine_build_ref }}
          path: root/scripts
      - uses: actions/checkout@v5
        with:
          repository: athei/wine
          ref: ${{ inputs.wine_ref }}
          path: root/src
          fetch-depth: 1
      # One commit per patch, so the tree is clean and WINE_COMMIT names what
      # was built.
      - name: Prepare the sources
        run: |
          for p in "$GITHUB_WORKSPACE"/ci/patches/wine-build/*.patch; do git -C root/scripts apply --verbose "$p"; done
          echo "${{ inputs.fex_ref }}" > root/scripts/pins/fex-src.ref
          echo "${{ inputs.mesa_ref }}" > root/scripts/pins/mesa-src.ref
          for p in "$GITHUB_WORKSPACE"/ci/patches/wine/*.patch; do
            git -C root/src apply --verbose "$p"
            git -C root/src add -A
            git -C root/src -c user.name=wowsilicon-arm64 -c user.email=wowsilicon-arm64@users.noreply.github.com \
              commit --quiet -m "$(basename "$p" .patch)"
          done
          git -C root/src log --oneline -8
      - name: Toolchain
        run: |
          brew install $FORMULAE
          curl -fsSL -o "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.tar.xz" | shasum -a 256 -c
          tar -xf "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          echo "MINGW_DIR=$RUNNER_TEMP/$LLVM_MINGW" >> "$GITHUB_ENV"
          xcrun -sdk macosx -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx -f metal
          xcrun --show-sdk-version
          rustc --version
      - name: Signed loader app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.loader_release }}
        run: |
          asset="wine-$RELEASE-macos-arm64.tar.xz"
          digest=$(gh api "repos/athei/wine-build/releases/tags/$RELEASE" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          gh release download "$RELEASE" -R athei/wine-build -p "$asset" -D "$RUNNER_TEMP"
          echo "${digest#sha256:}  $RUNNER_TEMP/$asset" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/loader"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/loader" wine/lib/wine/aarch64-unix/wine.app
          app="$RUNNER_TEMP/loader/wine/lib/wine/aarch64-unix/wine.app"
          codesign --verify --strict --verbose "$app"
          echo "LOADER_APP=$app" >> "$GITHUB_ENV"
      # LLVM 15's static libraries take the longest to build and change only
      # with the pin, so they are saved as soon as build-wine.sh has them,
      # even when a later step fails.
      - name: Restore LLVM 15 for DXMT
        id: llvm15
        uses: actions/cache/restore@v4
        with:
          path: root/build/dxmt/llvm15
          key: dxmt-llvm15-${{ hashFiles('root/scripts/pins/redist.env') }}-xcode27
      - name: build-wine.sh
        run: root/scripts/bin/build-wine.sh
      - name: Save LLVM 15 for DXMT
        if: always() && steps.llvm15.outputs.cache-hit != 'true' && hashFiles('root/build/dxmt/llvm15/COMMIT') != ''
        uses: actions/cache/save@v4
        with:
          path: root/build/dxmt/llvm15
          key: dxmt-llvm15-${{ hashFiles('root/scripts/pins/redist.env') }}-xcode27
      - name: bundle-wine.sh
        run: root/scripts/bin/bundle-wine.sh --runtime-only --yes
      - name: Package
        run: |
          name="wowsilicon-arm64-$(git -C root/src describe --tags --always)"
          {
            echo "wine: athei/wine@$(git -C root/src rev-parse HEAD~$(ls ci/patches/wine/*.patch | wc -l | tr -d ' ')) + $(ls ci/patches/wine | tr '\n' ' ')"
            echo "wine-build: athei/wine-build@$(git -C root/scripts rev-parse HEAD) + $(ls ci/patches/wine-build | tr '\n' ' ')"
            echo "fex: athei/FEX@${{ inputs.fex_ref }}"
            echo "mesa: athei/mesa@${{ inputs.mesa_ref }}"
            echo "loader: wine.app of athei/wine-build ${{ inputs.loader_release }}"
            echo "repo: $GITHUB_REPOSITORY@$GITHUB_SHA"
            echo "sdk: $(xcrun --show-sdk-version)"
            echo "version: $(root/dist/wine/bin/wine --version)"
          } | tee root/dist/wine/BUILD-INFO.txt
          tar -C root/dist -cJf "$name.tar.xz" wine
          shasum -a 256 "$name.tar.xz" | tee "$name.tar.xz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz
            ${{ env.NAME }}.tar.xz.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
