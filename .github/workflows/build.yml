name: build

# The arm64 Wine bundle, built the way athei/mach9's own release.yml
# builds it (the same layout, scripts, flags, Homebrew action and caches),
# with this repository's patches on top: patches/wine on athei/wine,
# patches/fex on athei/FEX and patches/wine-build on the scripts, each
# committed, since package.sh names commits and refuses uncommitted changes.
# The one step that differs is signing: release.yml signs the loader with
# the team's identity from its secrets, which this repository does not have,
# so the signed wine.app comes from a mach9 release and bundle-wine.sh
# refuses it unless the loader this build makes is the same code
# (patches/wine-build/0001). app.yml then builds WoWSilicon.app around the
# bundle. Manual only.
on:
  workflow_dispatch:
    inputs:
      wine_build_ref:
        description: athei/mach9 branch, tag or full commit SHA whose scripts and pins build it
        default: main
        type: string
      wine_ref:
        description: athei/wine ref to build instead of pins/wine-src.ref (empty for the pin, a branch, so its newest commit)
        default: ""
        type: string
      fex_ref:
        description: athei/FEX ref to build instead of pins/fex-src.ref (empty for the pin, a branch, so its newest commit)
        default: ""
        type: string
      loader_release:
        description: athei/mach9 release whose signed wine.app is bundled (empty for the latest)
        default: ""
        type: string

permissions:
  contents: read
  # app.yml, called below, reads this run's artifact.
  actions: read

# bash -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci
      # The scripts take the workspace, the parent of scripts/, as the root of
      # their layout: the Wine source in src/, downloads in cache/, the trees
      # under build/ and the bundle in dist/.
      - uses: actions/checkout@v7
        with:
          repository: athei/mach9
          ref: ${{ inputs.wine_build_ref }}
          path: scripts
          persist-credentials: false
      - name: Read the Wine source ref
        id: ref
        run: |
          ref="${{ inputs.wine_ref }}"
          [ -n "$ref" ] || ref=$(tr -d '[:space:]' < scripts/pins/wine-src.ref)
          if [ -z "$ref" ]; then
            echo "pins/wine-src.ref names no ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # The whole history without file contents: the build writes `git
      # describe` into ntdll, and the notes name it.
      - uses: actions/checkout@v7
        with:
          repository: athei/wine
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Fetch the Wine release tag
        run: |
          version=$(sed -n 's/^Wine version //p' src/VERSION)
          git -C src fetch --quiet --no-tags https://github.com/wine-mirror/wine \
            "refs/tags/wine-$version:refs/tags/wine-$version"
          git -C src describe HEAD
      # One commit per patch, so the trees are clean and the notes name what
      # was built. build-fex.sh clones FEX_REPO and checks out fex-src.ref, so
      # the patched FEX is a local repository.
      - name: Apply this repository's patches
        run: |
          # A patch directory may be empty or absent.
          shopt -s nullglob
          # The base commit's date, so the same patches give the same SHA: DXMT's dist cache key names Wine's HEAD.
          commit() {
            git -C "$1" add -A
            date=$(git -C "$1" log -1 --format=%cI)
            GIT_AUTHOR_DATE=$date GIT_COMMITTER_DATE=$date \
              git -C "$1" -c user.name=wowsilicon-arm64 -c user.email=wowsilicon-arm64@users.noreply.github.com \
              commit --quiet -m "$2"
          }
          for p in "$GITHUB_WORKSPACE"/ci/patches/wine/*.patch; do
            git -C src apply --verbose "$p"
            commit src "$(basename "$p" .patch)"
          done
          fex_ref="${{ inputs.fex_ref }}"
          [ -n "$fex_ref" ] || fex_ref=$(tr -d '[:space:]' < scripts/pins/fex-src.ref)
          fex="$RUNNER_TEMP/fex"
          git init --quiet "$fex"
          git -C "$fex" fetch --quiet --depth 1 https://github.com/athei/FEX "$fex_ref"
          git -C "$fex" checkout --quiet FETCH_HEAD
          echo "FEX_BASE=$(git -C "$fex" rev-parse HEAD)" >> "$GITHUB_ENV"
          for p in "$GITHUB_WORKSPACE"/ci/patches/fex/*.patch; do
            git -C "$fex" apply --verbose "$p"
            commit "$fex" "$(basename "$p" .patch)"
          done
          echo "FEX_REPO=file://$fex" >> "$GITHUB_ENV"
          for p in "$GITHUB_WORKSPACE"/ci/patches/wine-build/*.patch; do
            git -C scripts apply --verbose "$p"
            commit scripts "$(basename "$p" .patch)"
          done
          git -C "$fex" rev-parse HEAD > scripts/pins/fex-src.ref
          commit scripts "Build the patched FEX"
          git -C src log --oneline -10
          git -C scripts log --oneline -4
      - name: Report the runner, select Xcode and its Metal toolchain
        run: scripts/bin/ci/host.sh --metal
      # In place of release.yml's "Import the signing identity".
      - name: Signed loader app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.loader_release }}
        run: |
          [ -n "$RELEASE" ] || RELEASE=$(gh api repos/athei/mach9/releases/latest --jq .tag_name)
          echo "Loader from $RELEASE"
          echo "LOADER_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          asset="wine-$RELEASE-macos-arm64.tar.xz"
          digest=$(gh api "repos/athei/mach9/releases/tags/$RELEASE" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          gh release download "$RELEASE" -R athei/mach9 -p "$asset" -D "$RUNNER_TEMP"
          echo "${digest#sha256:}  $RUNNER_TEMP/$asset" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/loader"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/loader" wine/lib/wine/aarch64-unix/wine.app
          app="$RUNNER_TEMP/loader/wine/lib/wine/aarch64-unix/wine.app"
          codesign --verify --strict --verbose "$app"
          # The loader is compared section by section, and a linker of another
          # Xcode lays out __unwind_info differently, so the SDK has to be the
          # release's. Checked here, before hours of building.
          want=$(otool -l "$app/Contents/MacOS/wine" | awk '$1 == "sdk" { print $2; exit }')
          have=$(xcrun --sdk macosx --show-sdk-version)
          if [ "$want" != "$have" ]; then
            echo "Error: $RELEASE's loader was linked with the macOS $want SDK, this runner's Xcode has $have."
            exit 1
          fi
          echo "LOADER_APP=$app" >> "$GITHUB_ENV"
      - name: Install the Homebrew formulae
        uses: ./scripts/.github/actions/brew
      - name: Compute the cache keys
        id: keys
        run: |
          SCRIPT_DIR=scripts/bin . scripts/bin/lib/profile.sh
          . scripts/pins/redist.env
          xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          llvm15=$(scripts/bin/ci/pins-key.sh LLVM15_)
          redist=$(scripts/bin/ci/pins-key.sh MTLD3D_ LLVM_MINGW_)
          {
            echo "llvm15=dxmt-llvm15-$LLVM15_GIT_COMMIT-floor$MACOS_FLOOR-xcode$xcode-$ImageOS-$llvm15"
            echo "redist=redist-$redist"
            echo "ccache-prefix=ccache-$ImageOS-"
            echo "ccache=ccache-$ImageOS-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          # The compilers go through the ccache of the Homebrew formulae, as in release.yml.
          {
            echo "WINE_BUILD_CCACHE=$DEPS_PREFIX/bin/ccache"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"
      - name: Cache the pinned downloads
        uses: actions/cache@v6
        with:
          path: cache
          key: ${{ steps.keys.outputs.redist }}
      - name: Install llvm-mingw
        run: |
          scripts/bin/ci/llvm-mingw.sh "$HOME/llvm-mingw"
          echo "MINGW_DIR=$HOME/llvm-mingw" >> "$GITHUB_ENV"
      - name: Add the Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Cache the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('scripts/compatdb/Cargo.lock') }}
      # release.yml's caches: one per staged dist, keyed by the hash of the KEY
      # line its build script would write now (--print-key: the commit, the
      # script, the toolchain), so a dist whose inputs did not change is not
      # rebuilt, and a rolling ccache for everything that is. FEX's key names
      # the patched commit, which pins/fex-src.ref holds by now. A
      # wine_build_ref older than --print-key gets no dist caches.
      - name: Compute the dist cache keys
        id: dists
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            key=$(scripts/bin/build-$c.sh --print-key) || { echo "$c: no --print-key"; continue; }
            echo "$c: $key"
            echo "${c%%-*}=dist-$c-$ImageOS-$(printf '%s\n' "$key" | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done
      - name: Restore Mesa's dist
        id: mesa-dist
        if: steps.dists.outputs.mesa != ''
        uses: actions/cache/restore@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.dists.outputs.mesa }}
      - name: Restore GStreamer's dist
        id: gstreamer-dist
        if: steps.dists.outputs.gstreamer != ''
        uses: actions/cache/restore@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.dists.outputs.gstreamer }}
      - name: Restore FEX's dist
        id: fex-dist
        if: steps.dists.outputs.fex != ''
        uses: actions/cache/restore@v6
        with:
          path: build/fex/dist
          key: ${{ steps.dists.outputs.fex }}
      - name: Restore DXMT's dist
        id: dxmt-dist
        if: steps.dists.outputs.dxmt != ''
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.dists.outputs.dxmt }}
      - name: Restore vkd3d-proton's dist
        id: vkd3d-dist
        if: steps.dists.outputs.vkd3d != ''
        uses: actions/cache/restore@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.dists.outputs.vkd3d }}
      - name: Restore DXMT's LLVM
        id: llvm15-cache
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}
      - name: Restore the ccache directory
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}
          restore-keys: ${{ steps.keys.outputs.ccache-prefix }}
      # So that the statistics after the build are this run's.
      - name: Reset the ccache statistics
        run: '"$WINE_BUILD_CCACHE" --zero-stats'
      # Without --clean, which would only delete the dists restored above; the
      # scripts check those against their KEY themselves.
      - name: Build
        id: build
        run: scripts/bin/build-wine.sh
      - name: Report the ccache statistics
        if: always() && steps.build.conclusion != 'skipped'
        run: '"$WINE_BUILD_CCACHE" --show-stats'
      - name: Save the ccache directory
        if: always() && steps.build.conclusion != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}
      # The key each complete dist is saved under, from the KEY its build
      # wrote; none for a dist that is missing or incomplete.
      - name: Compute the dist save keys
        id: saves
        if: always() && steps.build.conclusion != 'skipped'
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            dist=build/$c/dist
            if [ -f "$dist/COMMIT" ] && [ -f "$dist/KEY" ]; then
              echo "${c%%-*}=dist-$c-$ImageOS-$(shasum -a 256 < "$dist/KEY" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Save Mesa's dist
        if: always() && steps.saves.outputs.mesa != '' && (steps.mesa-dist.outputs.cache-hit != 'true' || steps.saves.outputs.mesa != steps.dists.outputs.mesa)
        uses: actions/cache/save@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.saves.outputs.mesa }}
      - name: Save GStreamer's dist
        if: always() && steps.saves.outputs.gstreamer != '' && (steps.gstreamer-dist.outputs.cache-hit != 'true' || steps.saves.outputs.gstreamer != steps.dists.outputs.gstreamer)
        uses: actions/cache/save@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.saves.outputs.gstreamer }}
      - name: Save FEX's dist
        if: always() && steps.saves.outputs.fex != '' && (steps.fex-dist.outputs.cache-hit != 'true' || steps.saves.outputs.fex != steps.dists.outputs.fex)
        uses: actions/cache/save@v6
        with:
          path: build/fex/dist
          key: ${{ steps.saves.outputs.fex }}
      - name: Save DXMT's dist
        if: always() && steps.saves.outputs.dxmt != '' && (steps.dxmt-dist.outputs.cache-hit != 'true' || steps.saves.outputs.dxmt != steps.dists.outputs.dxmt)
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.saves.outputs.dxmt }}
      - name: Save vkd3d-proton's dist
        if: always() && steps.saves.outputs.vkd3d != '' && (steps.vkd3d-dist.outputs.cache-hit != 'true' || steps.saves.outputs.vkd3d != steps.dists.outputs.vkd3d)
        uses: actions/cache/save@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.saves.outputs.vkd3d }}
      - name: Save DXMT's LLVM
        if: always() && steps.llvm15-cache.outputs.cache-hit != 'true' && hashFiles('build/dxmt/llvm15/COMMIT') != ''
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}
      - name: Bundle
        run: scripts/bin/bundle-wine.sh --strict-floor --symbols --yes
      - name: Package
        run: |
          name="wowsilicon-arm64-$(git -C src describe --tags --always)"
          scripts/bin/ci/package.sh "$name" "$RUNNER_TEMP/release"
          {
            echo "wine: athei/wine@$(git -C src rev-parse HEAD~$(ls ci/patches/wine/*.patch | wc -l | tr -d ' ')) + $(ls ci/patches/wine | tr '\n' ' ')"
            echo "mach9: athei/mach9@$(git -C scripts rev-parse "HEAD~$(( $(ls ci/patches/wine-build/*.patch | wc -l) + 1 ))") + $(ls ci/patches/wine-build | tr '\n' ' ')"
            echo "fex: athei/FEX@$FEX_BASE + $([ -d ci/patches/fex ] && ls ci/patches/fex | tr '\n' ' ')"
            echo "loader: wine.app of athei/mach9 $LOADER_RELEASE"
            echo "repo: $GITHUB_REPOSITORY@$GITHUB_SHA"
            echo "sdk: $(xcrun --show-sdk-version)"
          } | tee "$RUNNER_TEMP/release/BUILD-INFO.txt"
          cat "$RUNNER_TEMP/release/notes.md"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "wine-$name-macos-arm64.tar.xz" | tee "wine-$name-macos-arm64.tar.xz.sha256")
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ runner.temp }}/release/wine-${{ env.NAME }}-macos-arm64.tar.xz
            ${{ runner.temp }}/release/wine-${{ env.NAME }}-macos-arm64.tar.xz.sha256
            ${{ runner.temp }}/release/notes.md
            ${{ runner.temp }}/release/BUILD-INFO.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ env.NAME }}
          path: ${{ runner.temp }}/release/wine-${{ env.NAME }}-macos-arm64-symbols.tar.xz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  app:
    needs: build
    uses: ./.github/workflows/app.yml
